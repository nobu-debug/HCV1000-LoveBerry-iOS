name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install cmake ninja

      - name: Find source ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf source
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Locate CMake project
        shell: bash
        run: |
          set -e
          CMAKE_DIR=$(find source -name CMakeLists.txt -type f -print -quit | xargs -I{} dirname "{}")
          if [ -z "$CMAKE_DIR" ]; then
            echo "CMakeLists.txt not found"
            exit 1
          fi
          echo "CMAKE_DIR=$CMAKE_DIR" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -e
          rm -rf build
          cmake -S "$CMAKE_DIR" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package
        shell: bash
        run: |
          set -e
          rm -rf artifact
          mkdir -p artifact
          cp -R build/. artifact/
          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            'Target: melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            'This package contains the generated build.' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: artifact/
          if-no-files-found: error
