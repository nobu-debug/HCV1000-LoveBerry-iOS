name: Analyze HCV-1000 Love & Berry ZIP

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          set -e

          ZIP="HCV1000_LoveBerry_iOS_REBUILT_v4.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP"

          echo
          echo "SHA256:"
          shasum -a 256 "$ZIP"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf unpacked analysis
          mkdir -p unpacked analysis

          unzip -q HCV1000_LoveBerry_iOS_REBUILT_v4.zip -d unpacked

      - name: Analyze ZIP structure
        shell: bash
        run: |
          set -e

          REPORT="analysis/REPORT.txt"

          {
            echo "========================================"
            echo "HCV-1000 Love & Berry ZIP ANALYSIS"
            echo "========================================"
            echo

            echo "ZIP:"
            echo "HCV1000_LoveBerry_iOS_REBUILT_v4.zip"
            echo

            echo "SHA256:"
            shasum -a 256 HCV1000_LoveBerry_iOS_REBUILT_v4.zip
            echo

            echo "========================================"
            echo "ALL FILES"
            echo "========================================"

            find unpacked -type f -print | sort

            echo
            echo "========================================"
            echo "CMakeLists.txt"
            echo "========================================"

            find unpacked \
              -type f \
              -name 'CMakeLists.txt' \
              -print | sort

            echo
            echo "========================================"
            echo "iOS TOOLCHAIN"
            echo "========================================"

            find unpacked \
              -type f \
              -name 'ios.toolchain.cmake' \
              -print | sort

            echo
            echo "========================================"
            echo "MAKEFILES"
            echo "========================================"

            find unpacked \
              -type f \
              \( \
                -name 'Makefile' \
                -o -name 'Makefile.libretro' \
                -o -name 'GNUmakefile' \
              \) \
              -print | sort

            echo
            echo "========================================"
            echo "LIBRETRO FILES"
            echo "========================================"

            find unpacked \
              -type f \
              \( \
                -iname '*libretro*' \
                -o -iname '*.info' \
                -o -iname '*.info.in' \
              \) \
              -print | sort

            echo
            echo "========================================"
            echo "HCV / CARD / BARCODE FILE NAMES"
            echo "========================================"

            find unpacked \
              -type f \
              | grep -Ei 'hcv|card|barcode|sega|reader|slot2|slot_2' \
              || true

            echo
            echo "========================================"
            echo "SOURCE FILE TYPES"
            echo "========================================"

            find unpacked \
              -type f \
              | grep -Ei '\.(c|cc|cpp|cxx|h|hpp|m|mm|cmake|mk)$' \
              | sort

            echo
            echo "========================================"
            echo "POSSIBLE BUILD SYSTEM"
            echo "========================================"

            CMAKE_COUNT=$(
              find unpacked \
                -type f \
                -name 'CMakeLists.txt' \
                | wc -l \
                | tr -d ' '
            )

            TOOLCHAIN_COUNT=$(
              find unpacked \
                -type f \
                -name 'ios.toolchain.cmake' \
                | wc -l \
                | tr -d ' '
            )

            MAKE_COUNT=$(
              find unpacked \
                -type f \
                \( \
                  -name 'Makefile' \
                  -o -name 'Makefile.libretro' \
                  -o -name 'GNUmakefile' \
                \) \
                | wc -l \
                | tr -d ' '
            )

            echo "CMakeLists.txt count: $CMAKE_COUNT"
            echo "ios.toolchain.cmake count: $TOOLCHAIN_COUNT"
            echo "Makefile count: $MAKE_COUNT"
            echo

            if [ "$CMAKE_COUNT" -gt 0 ]; then
              echo "RESULT: CMake source exists."
            else
              echo "RESULT: No CMakeLists.txt found."
            fi

            if [ "$TOOLCHAIN_COUNT" -gt 0 ]; then
              echo "RESULT: iOS toolchain exists."
            else
              echo "RESULT: No ios.toolchain.cmake found."
            fi

            if [ "$MAKE_COUNT" -gt 0 ]; then
              echo "RESULT: Makefile-based build files exist."
            else
              echo "RESULT: No Makefile-based build files found."
            fi

            echo
            echo "========================================"
            echo "HCV CONTENT SEARCH"
            echo "========================================"

            grep -RniE \
              'HCV.?1000|card.?reader|barcode|Sega Card Reader|slot.?2|slot2' \
              unpacked \
              --include='*.c' \
              --include='*.cc' \
              --include='*.cpp' \
              --include='*.cxx' \
              --include='*.h' \
              --include='*.hpp' \
              --include='*.m' \
              --include='*.mm' \
              --include='*.cmake' \
              --include='*.txt' \
              2>/dev/null \
              | head -n 300 \
              || true

            echo
            echo "========================================"
            echo "ANALYSIS COMPLETE"
            echo "========================================"

          } > "$REPORT"

          cat "$REPORT"

      - name: Create complete file list
        run: |
          find unpacked -type f -print | sort \
            > analysis/FILE_LIST.txt

      - name: Create directory tree
        run: |
          find unpacked -type d -print | sort \
            > analysis/DIRECTORIES.txt

      - name: Create analysis ZIP
        run: |
          cd analysis
          zip -r ../HCV1000_LoveBerry_iOS_ANALYSIS.zip .

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-analysis
          path: HCV1000_LoveBerry_iOS_ANALYSIS.zip
