name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "$SOURCE_ZIP" -d source

          echo "=== extracted files ==="
          find source -maxdepth 3 -type f | head -100

      - name: Locate melonDS source
        shell: bash
        run: |
          set -e

          ROOT="$(find source -type f -name CMakeLists.txt -print | head -n 1 | xargs -I{} dirname "{}")"

          if [ -z "$ROOT" ]; then
            echo "ERROR: CMakeLists.txt not found."
            exit 1
          fi

          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Source root: $ROOT"

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config

      - name: Configure
        shell: bash
        run: |
          set -e

          cd "$SOURCE_ROOT"

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRETRO=ON

      - name: Build
        shell: bash
        run: |
          set -e

          cd "$SOURCE_ROOT"
          cmake --build build --parallel

      - name: Find generated libretro core
        shell: bash
        run: |
          set -e

          CORE="$(find "$SOURCE_ROOT/build" -type f \( \
            -name '*.dylib' -o \
            -name '*.framework' -o \
            -name '*.a' \
            \) | head -n 1)"

          if [ -z "$CORE" ]; then
            echo "ERROR: No generated iOS/libretro core was found."
            echo "=== build directory ==="
            find "$SOURCE_ROOT/build" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "CORE=$CORE" >> "$GITHUB_ENV"
          echo "Generated core: $CORE"

      - name: Package
        shell: bash
        run: |
          set -e

          rm -rf artifact
          mkdir artifact

          cp -R "$CORE" artifact/

          cp -R "$SOURCE_ROOT/src/libretro/config" artifact/config 2>/dev/null || true

          cat > artifact/README.txt <<'EOF'
HCV-1000 Love & Berry iOS/libretro build

Target:
melonDS DS 1.3.1

Game:
Oshare Majo Love and Berry: DS Collection

Game code:
ALBJ

Default HCV-1000 card:
*OUMLMHQ697D*

This build contains the HCV-1000 virtual Slot-2 implementation.
EOF

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS
          path: artifact/
