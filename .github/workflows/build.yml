name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          set -e
          ZIP="$(find . -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf source
          mkdir -p source
          unzip -q "${{ steps.source.outputs.zip }}" -d source
          echo "=== SOURCE FILES ==="
          find source -type f | head -200

      - name: Locate build project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          CMAKE="$(find source -name CMakeLists.txt -type f | head -n 1)"
          MAKE="$(find source -name Makefile -type f | head -n 1)"
          XCODE="$(find source -name '*.xcodeproj' -type d | head -n 1)"
          PACKAGE="$(find source -name Package.swift -type f | head -n 1)"

          if [ -n "$CMAKE" ]; then
            ROOT="$(dirname "$CMAKE")"
            echo "type=cmake" >> "$GITHUB_OUTPUT"
          elif [ -n "$MAKE" ]; then
            ROOT="$(dirname "$MAKE")"
            echo "type=make" >> "$GITHUB_OUTPUT"
          elif [ -n "$XCODE" ]; then
            ROOT="$(dirname "$XCODE")"
            echo "type=xcode" >> "$GITHUB_OUTPUT"
          elif [ -n "$PACKAGE" ]; then
            ROOT="$(dirname "$PACKAGE")"
            echo "type=swift" >> "$GITHUB_OUTPUT"
          else
            echo "No supported build project found."
            echo "The ZIP must contain a CMake project, Makefile, Xcode project, or Swift package."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Build root: $ROOT"

      - name: Build CMake project
        if: steps.project.outputs.type == 'cmake'
        shell: bash
        run: |
          set -e
          brew install cmake ninja
          cmake -S "${{ steps.project.outputs.root }}" \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Build Make project
        if: steps.project.outputs.type == 'make'
        shell: bash
        run: |
          set -e
          make -C "${{ steps.project.outputs.root }}" -j"$(sysctl -n hw.ncpu)"

      - name: Build Xcode project
        if: steps.project.outputs.type == 'xcode'
        shell: bash
        run: |
          set -e
          XCODE="$(find "${{ steps.project.outputs.root }}" -name '*.xcodeproj' -type d | head -n 1)"
          xcodebuild \
            -project "$XCODE" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build Swift package
        if: steps.project.outputs.type == 'swift'
        shell: bash
        run: |
          set -e
          cd "${{ steps.project.outputs.root }}"
          swift build -c release

      - name: Find generated core
        id: core
        shell: bash
        run: |
          set -e

          CORE="$(find . -type f \( \
            -name '*.dylib' -o \
            -name '*.framework' -o \
            -name '*.a' \
          \) | head -n 1)"

          if [ -z "$CORE" ]; then
            echo "No iOS core was generated."
            echo "=== BUILD OUTPUT ==="
            find . -type f | grep -E '\.(dylib|framework|a)$' || true
            exit 1
          fi

          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "Generated: $CORE"

      - name: Package
        shell: bash
        run: |
          set -e
          rm -rf artifact
          mkdir -p artifact
          cp -R "${{ steps.core.outputs.core }}" artifact/

          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            '' \
            'Target: melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: artifact
          if-no-files-found: error
