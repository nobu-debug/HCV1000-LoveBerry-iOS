name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf unpacked
          mkdir -p unpacked
          unzip -q HCV1000_LoveBerry_iOS_REBUILT_v4.zip -d unpacked

      - name: Inspect source
        run: |
          echo "=== Files ==="
          find unpacked -type f | sort

          echo
          echo "=== Makefiles ==="
          find unpacked -type f \( \
            -name 'Makefile' -o \
            -name 'Makefile.libretro' -o \
            -name 'GNUmakefile' \
          \) -print

      - name: Locate libretro Makefile
        run: |
          MAKEFILE="$(find unpacked -type f \
            \( -name 'Makefile' -o -name 'Makefile.libretro' -o -name 'GNUmakefile' \) \
            -print -quit)"

          if [ -z "$MAKEFILE" ]; then
            echo "ERROR: No Makefile was found in the ZIP."
            exit 1
          fi

          SOURCE_DIR="$(dirname "$MAKEFILE")"

          echo "MAKEFILE=$MAKEFILE"
          echo "SOURCE_DIR=$SOURCE_DIR"

          echo "MAKEFILE=$MAKEFILE" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Verify Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version
          make --version

      - name: Build iOS ARM64
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          make platform=ios-arm64 -j3

      - name: Find generated core
        run: |
          echo "=== Generated dylibs ==="
          find "$SOURCE_DIR" -type f -name '*.dylib' -print

      - name: Collect artifact
        run: |
          rm -rf artifact
          mkdir -p artifact

          find "$SOURCE_DIR" \
            -type f \
            -name '*.dylib' \
            -exec cp {} artifact/ \;

          if ! find artifact -type f -name '*.dylib' -print -quit | grep -q .; then
            echo "ERROR: No iOS dylib was generated."
            exit 1
          fi

          echo "=== Artifact ==="
          find artifact -type f -print

          cd artifact
          zip -r ../HCV1000_LoveBerry_iOS_core.zip .

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: HCV1000_LoveBerry_iOS_core.zip
