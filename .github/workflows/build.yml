name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install cmake ninja

      - name: Find source ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi
          echo "ZIP=$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          rm -rf source
          mkdir source
          unzip -q "$ZIP" -d source
          echo "=== SOURCE ==="
          find source -maxdepth 4 -type f | head -200

      - name: Find CMake project
        shell: bash
        run: |
          set -e
          CMAKE=$(find source -name CMakeLists.txt -type f | head -n 1)
          if [ -z "$CMAKE" ]; then
            echo "ERROR: CMakeLists.txt not found"
            find source -maxdepth 5 -type f
            exit 1
          fi
          DIR=$(dirname "$CMAKE")
          echo "BUILD_DIR=$DIR" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$DIR"

      - name: Configure
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR"
          rm -rf build
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -e
          cd "$BUILD_DIR/build"
          cmake --build . --parallel

      - name: Find generated core
        shell: bash
        run: |
          set -e
          CORE=$(find "$BUILD_DIR/build" -type f \( -name "*.dylib" -o -name "*.so" \) | head -n 1)
          if [ -z "$CORE" ]; then
            echo "ERROR: Generated core not found"
            find "$BUILD_DIR/build" -type f
            exit 1
          fi
          echo "CORE=$CORE" >> "$GITHUB_ENV"
          echo "CORE=$CORE"

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          rm -rf artifact
          mkdir artifact
          cp "$CORE" artifact/HCV1000-LoveBerry-iOS-core
          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            'Target: melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: artifact
          if-no-files-found: error
