name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install cmake ninja

      - name: Check iOS SDK
        shell: bash
        run: |
          set -e

          xcodebuild -showsdks

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          test -d "$SDK"

          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

          echo "iPhoneOS SDK: $SDK"

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source

          mkdir -p source

          unzip -q "$ZIP" -d source

          test -f source/finalpkg/CMakeLists.txt
          test -f source/finalpkg/cmake/FetchDependencies.cmake
          test -f source/finalpkg/patches/melonds-7117178-hcv1000-loveberry.patch

          echo "Source extracted successfully."

      - name: Replace FetchDependencies
        shell: bash
        run: |
          set -e

          cat > source/finalpkg/cmake/FetchDependencies.cmake <<'CMAKE'
          include(FetchContent)
          find_package(Git REQUIRED)

          macro(define_git_dependency_vars name default_url default_tag)
              set(${name}_URL "${default_url}" CACHE STRING "")
              set(${name}_TAG "${default_tag}" CACHE STRING "")
          endmacro()

          function(fetch_dependency name default_url default_tag)
              define_git_dependency_vars(
                  "${name}"
                  "${default_url}"
                  "${default_tag}"
              )

              FetchContent_Declare(
                  ${name}
                  GIT_REPOSITORY "${${name}_URL}"
                  GIT_TAG "${${name}_TAG}"
                  GIT_SHALLOW FALSE
              )
          endfunction()

          fetch_dependency(
              libretro-common
              "https://github.com/libretro/libretro-common"
              "ad9124f"
          )

          fetch_dependency(
              embed-binaries
              "https://github.com/andoalon/embed-binaries"
              "078b62b"
          )

          fetch_dependency(
              glm
              "https://github.com/g-truc/glm"
              "e7970a8"
          )

          fetch_dependency(
              libslirp
              "https://github.com/JesseTG/libslirp-mirror"
              "e61dbd4"
          )

          fetch_dependency(
              pntr
              "https://github.com/robloach/pntr"
              "922aed0"
          )

          fetch_dependency(
              fmt
              "https://github.com/fmtlib/fmt"
              "11.2.0"
          )

          fetch_dependency(
              yamc
              "https://github.com/yohhoy/yamc"
              "4e015a7"
          )

          fetch_dependency(
              span-lite
              "https://github.com/martinmoene/span-lite"
              "00afc28"
          )

          fetch_dependency(
              date
              "https://github.com/HowardHinnant/date"
              "1ead671"
          )

          fetch_dependency(
              zlib
              "https://github.com/madler/zlib"
              "v1.3.1"
          )

          set(BUILD_STATIC ON CACHE BOOL "" FORCE)
          set(BUILD_STATIC_LIBS ON CACHE BOOL "" FORCE)
          set(BUILD_QT_SDL OFF CACHE BOOL "" FORCE)
          set(ENABLE_GDBSTUB OFF CACHE BOOL "" FORCE)

          set(GLM_BUILD_LIBRARY ON CACHE BOOL "" FORCE)
          set(GLM_ENABLE_CXX_17 ON CACHE BOOL "" FORCE)

          option(ENABLE_TESTING "Enable unit testing." OFF)

          set(ZLIB_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)

          if (${CMAKE_MAJOR_VERSION} VERSION_GREATER_EQUAL 4)
              set(CMAKE_POLICY_VERSION_MINIMUM 3.5)
          endif()

          set(MELONDS_SOURCE_DIR
              "${CMAKE_BINARY_DIR}/_deps/melonds-src"
          )

          set(MELONDS_BINARY_DIR
              "${CMAKE_BINARY_DIR}/_deps/melonds-build"
          )

          set(MELONDS_REPOSITORY
              "https://github.com/melonDS-emu/melonDS"
          )

          set(MELONDS_COMMIT
              "7117178c2dd56df32b6534ba6a54ad1f8547e693"
          )

          if (EXISTS "${MELONDS_SOURCE_DIR}/.git")
              file(REMOVE_RECURSE "${MELONDS_SOURCE_DIR}")
          endif()

          execute_process(
              COMMAND
                  "${GIT_EXECUTABLE}"
                  clone
                  --filter=blob:none
                  "${MELONDS_REPOSITORY}"
                  "${MELONDS_SOURCE_DIR}"
              RESULT_VARIABLE MELONDS_CLONE_RESULT
              OUTPUT_VARIABLE MELONDS_CLONE_STDOUT
              ERROR_VARIABLE MELONDS_CLONE_STDERR
          )

          if (NOT MELONDS_CLONE_RESULT EQUAL 0)
              message(STATUS "${MELONDS_CLONE_STDOUT}")
              message(STATUS "${MELONDS_CLONE_STDERR}")
              message(FATAL_ERROR "Failed to clone melonDS.")
          endif()

          execute_process(
              COMMAND
                  "${GIT_EXECUTABLE}"
                  -C "${MELONDS_SOURCE_DIR}"
                  checkout
                  "${MELONDS_COMMIT}"
              RESULT_VARIABLE MELONDS_CHECKOUT_RESULT
              OUTPUT_VARIABLE MELONDS_CHECKOUT_STDOUT
              ERROR_VARIABLE MELONDS_CHECKOUT_STDERR
          )

          if (NOT MELONDS_CHECKOUT_RESULT EQUAL 0)
              message(STATUS "${MELONDS_CHECKOUT_STDOUT}")
              message(STATUS "${MELONDS_CHECKOUT_STDERR}")
              message(FATAL_ERROR
                  "Failed to checkout melonDS commit ${MELONDS_COMMIT}."
              )
          endif()

          if (NOT EXISTS "${MELONDS_SOURCE_DIR}/CMakeLists.txt")
              message(FATAL_ERROR
                  "melonDS CMakeLists.txt was not found."
              )
          endif()

          set(melonds_SOURCE_DIR
              "${MELONDS_SOURCE_DIR}"
              CACHE PATH "" FORCE
          )

          set(melonds_BINARY_DIR
              "${MELONDS_BINARY_DIR}"
              CACHE PATH "" FORCE
          )

          set(melonDS_SOURCE_DIR
              "${MELONDS_SOURCE_DIR}"
              CACHE PATH "" FORCE
          )

          set(melonDS_BINARY_DIR
              "${MELONDS_BINARY_DIR}"
              CACHE PATH "" FORCE
          )

          execute_process(
              COMMAND
                  "${GIT_EXECUTABLE}"
                  -C "${MELONDS_SOURCE_DIR}"
                  apply
                  --whitespace=nowarn
                  --exclude=src/NDS.cpp
                  "${CMAKE_SOURCE_DIR}/patches/melonds-7117178-hcv1000-loveberry.patch"
              RESULT_VARIABLE HCV_PATCH_RESULT
              OUTPUT_VARIABLE HCV_PATCH_STDOUT
              ERROR_VARIABLE HCV_PATCH_STDERR
          )

          if (NOT HCV_PATCH_RESULT EQUAL 0)
              message(STATUS "${HCV_PATCH_STDOUT}")
              message(STATUS "${HCV_PATCH_STDERR}")
              message(FATAL_ERROR
                  "Failed to apply HCV-1000 patch to melonDS."
              )
          endif()

          message(STATUS "HCV-1000 patch applied successfully.")

          FetchContent_MakeAvailable(
              libretro-common
              embed-binaries
              glm
              zlib
              libslirp
              pntr
              fmt
              yamc
              span-lite
              date
          )

          set(CMAKE_MODULE_PATH
              "${MELONDS_SOURCE_DIR}/cmake"
              "${FETCHCONTENT_BASE_DIR}/embed-binaries-src/cmake"
              "${CMAKE_MODULE_PATH}"
          )

          add_subdirectory(
              "${MELONDS_SOURCE_DIR}"
              "${MELONDS_BINARY_DIR}"
          )

          if (NOT TARGET core)
              message(FATAL_ERROR
                  "melonDS was added, but target 'core' was not created."
              )
          endif()

          message(STATUS
              "melonDS target 'core' created successfully."
          )
          CMAKE

          echo "FetchDependencies.cmake replaced successfully."

      - name: Locate CMake project
        shell: bash
        run: |
          set -e

          CMAKE_DIR=$(
            find source \
              -name CMakeLists.txt \
              -type f \
              -print |
            grep '/finalpkg/CMakeLists.txt$' |
            head -n 1 |
            xargs -I{} dirname "{}"
          )

          if [ -z "$CMAKE_DIR" ]; then
            echo "finalpkg CMakeLists.txt not found"
            exit 1
          fi

          echo "CMAKE_DIR=$CMAKE_DIR" >> "$GITHUB_ENV"

          echo "Using: $CMAKE_DIR"

      - name: Configure for iPhoneOS arm64
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake \
            -S "$CMAKE_DIR" \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO

      - name: Verify iOS configuration
        shell: bash
        run: |
          set -e

          echo "=== CMake iOS configuration ==="

          grep '^CMAKE_SYSTEM_NAME:' build/CMakeCache.txt || true
          grep '^CMAKE_OSX_SYSROOT:' build/CMakeCache.txt || true
          grep '^CMAKE_OSX_ARCHITECTURES:' build/CMakeCache.txt || true

          SYSTEM_NAME=$(
            grep '^CMAKE_SYSTEM_NAME:' build/CMakeCache.txt |
            cut -d= -f2-
          )

          ARCHS=$(
            grep '^CMAKE_OSX_ARCHITECTURES:' build/CMakeCache.txt |
            cut -d= -f2-
          )

          SYSROOT=$(
            grep '^CMAKE_OSX_SYSROOT:' build/CMakeCache.txt |
            cut -d= -f2-
          )

          if [ "$SYSTEM_NAME" != "iOS" ]; then
            echo "Wrong CMAKE_SYSTEM_NAME: $SYSTEM_NAME"
            exit 1
          fi

          if [ "$ARCHS" != "arm64" ]; then
            echo "Wrong architecture: $ARCHS"
            exit 1
          fi

          if [[ "$SYSROOT" != *"iPhoneOS.platform"* ]]; then
            echo "Wrong SDK: $SYSROOT"
            exit 1
          fi

          echo "Confirmed: iPhoneOS arm64 configuration."

      - name: Build
        shell: bash
        run: |
          set -e

          cmake --build build --parallel

      - name: Verify generated binary
        shell: bash
        run: |
          set -e

          DYLIB=$(
            find build \
              -type f \
              -name 'melondsds_libretro.dylib' \
              -print |
            head -n 1
          )

          if [ -z "$DYLIB" ]; then
            echo "melondsds_libretro.dylib not found."
            exit 1
          fi

          echo "Binary: $DYLIB"

          file "$DYLIB"

          lipo -info "$DYLIB"

          file "$DYLIB" | grep -q 'arm64'

          PLATFORM_INFO=$(
            otool -l "$DYLIB" |
            grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' || true
          )

          echo "$PLATFORM_INFO"

          if ! echo "$PLATFORM_INFO" | grep -qi 'platform IOS'; then
            echo "Binary is not confirmed as an iOS binary."
            exit 1
          fi

          echo "Confirmed: iOS arm64 binary."

      - name: Package
        shell: bash
        run: |
          set -e

          rm -rf artifact

          mkdir -p artifact

          cp -R build/. artifact/

          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            'Target: iPhoneOS arm64' \
            'melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-arm64
          path: artifact/
          if-no-files-found: error
