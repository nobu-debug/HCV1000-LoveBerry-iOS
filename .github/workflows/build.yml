name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install cmake ninja python

      - name: Extract source ZIP
        run: |
          rm -rf unpacked
          mkdir -p unpacked
          unzip -q HCV1000_LoveBerry_iOS_REBUILT_v4.zip -d unpacked

      - name: Locate source and iOS toolchain
        run: |
          echo "=== ZIP contents ==="
          find unpacked -type f -print

          echo
          echo "=== Searching for ios.toolchain.cmake ==="
          TOOLCHAIN_FILE="$(find unpacked -type f -name 'ios.toolchain.cmake' -print -quit)"

          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "ERROR: ios.toolchain.cmake was not found."
            echo
            echo "=== Possible toolchain files ==="
            find unpacked -type f | grep -Ei 'toolchain|cmake' || true
            exit 1
          fi

          echo "Found toolchain:"
          echo "$TOOLCHAIN_FILE"

          echo
          echo "=== Searching for CMakeLists.txt ==="
          SOURCE_DIR="$(dirname "$(find unpacked -name CMakeLists.txt -print -quit)")"

          if [ -z "$SOURCE_DIR" ] || [ ! -f "$SOURCE_DIR/CMakeLists.txt" ]; then
            echo "ERROR: CMakeLists.txt was not found."
            exit 1
          fi

          echo "Found source:"
          echo "$SOURCE_DIR"

          echo "TOOLCHAIN_FILE=$TOOLCHAIN_FILE" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Verify source
        run: |
          echo "SOURCE_DIR=$SOURCE_DIR"
          echo "TOOLCHAIN_FILE=$TOOLCHAIN_FILE"

          test -f "$SOURCE_DIR/CMakeLists.txt"
          test -f "$TOOLCHAIN_FILE"

          echo "CMakeLists.txt: OK"
          echo "ios.toolchain.cmake: OK"

      - name: Configure iOS ARM64
        run: |
          rm -rf build-ios

          cmake \
            -S "$SOURCE_DIR" \
            -B build-ios \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_AS_SHARED_LIBRARY=ON \
            -DENABLE_JIT=OFF \
            -DENABLE_OPENGL=OFF

      - name: Build
        run: |
          cmake --build build-ios -j 3

      - name: Collect
        run: |
          rm -rf artifact
          mkdir -p artifact

          find build-ios \
            -type f \
            -name 'melondsds_libretro*.dylib' \
            -exec cp {} artifact/ \;

          if [ -f "$SOURCE_DIR/melondsds_libretro.info.in" ]; then
            cp "$SOURCE_DIR/melondsds_libretro.info.in" \
              artifact/melondsds_libretro.info.template
          fi

          if [ -f "$SOURCE_DIR/LICENSE" ]; then
            cp "$SOURCE_DIR/LICENSE" artifact/
          fi

          echo "=== Collected files ==="
          find artifact -maxdepth 1 -type f -print

          test -n "$(find artifact -name '*.dylib' -print -quit)"

          cd artifact
          zip -r ../HCV1000_LoveBerry_iOS_core.zip .

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: HCV1000_LoveBerry_iOS_core.zip
