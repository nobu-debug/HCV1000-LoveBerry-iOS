name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install cmake ninja

      - name: Extract source ZIP
        run: |
          rm -rf unpacked
          mkdir -p unpacked
          unzip -q HCV1000_LoveBerry_iOS_REBUILT_v4.zip -d unpacked

      - name: Locate CMake project
        shell: bash
        run: |
          set -e

          CMAKE_FILE="$(find unpacked -type f -name 'CMakeLists.txt' -print -quit)"

          if [ -z "$CMAKE_FILE" ]; then
            echo "ERROR: CMakeLists.txt not found."
            find unpacked -type f | sort
            exit 1
          fi

          SOURCE_DIR="$(dirname "$CMAKE_FILE")"

          echo "CMAKE_FILE=$CMAKE_FILE"
          echo "SOURCE_DIR=$SOURCE_DIR"

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Locate iOS toolchain
        shell: bash
        run: |
          set -e

          TOOLCHAIN_FILE="$(find "$SOURCE_DIR" -type f -name 'ios.toolchain.cmake' -print -quit)"

          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "ERROR: ios.toolchain.cmake not found."
            find "$SOURCE_DIR" -type f | grep -Ei 'toolchain|ios' || true
            exit 1
          fi

          echo "TOOLCHAIN_FILE=$TOOLCHAIN_FILE"
          echo "TOOLCHAIN_FILE=$TOOLCHAIN_FILE" >> "$GITHUB_ENV"

      - name: Verify source
        run: |
          echo "SOURCE_DIR=$SOURCE_DIR"
          echo "TOOLCHAIN_FILE=$TOOLCHAIN_FILE"

          test -f "$SOURCE_DIR/CMakeLists.txt"
          test -f "$TOOLCHAIN_FILE"

      - name: Verify Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version
          cmake --version
          ninja --version

      - name: Configure iOS ARM64
        shell: bash
        run: |
          set -e

          rm -rf build-ios

          cmake \
            -S "$SOURCE_DIR" \
            -B build-ios \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_AS_SHARED_LIBRARY=ON \
            -DENABLE_JIT=OFF \
            -DENABLE_OPENGL=OFF

      - name: Build
        run: |
          cmake --build build-ios -j 3

      - name: Inspect generated files
        run: |
          echo "=== Generated files ==="
          find build-ios -type f \
            \( -name '*.dylib' -o -name '*libretro*' \) \
            -print | sort

      - name: Check HCV-1000 symbols
        run: |
          echo "=== HCV-1000 related strings ==="

          find build-ios -type f -name '*.dylib' -print0 |
          while IFS= read -r -d '' file; do
            echo "----- $file -----"
            strings "$file" | grep -Ei \
              'HCV|1000|barcode|card.?reader|love.?berry|sega' \
              || true
          done

      - name: Collect core
        shell: bash
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          find build-ios \
            -type f \
            -name '*.dylib' \
            -exec cp {} artifact/ \;

          if [ -f "$SOURCE_DIR/melondsds_libretro.info" ]; then
            cp "$SOURCE_DIR/melondsds_libretro.info" artifact/
          fi

          if [ -f "$SOURCE_DIR/melondsds_libretro.info.in" ]; then
            cp "$SOURCE_DIR/melondsds_libretro.info.in" artifact/
          fi

          echo "=== Artifact ==="
          find artifact -maxdepth 1 -type f -print

          if ! find artifact -type f -name '*.dylib' -print -quit | grep -q .; then
            echo "ERROR: No dylib generated."
            exit 1
          fi

          cd artifact
          zip -r ../HCV1000_LoveBerry_iOS_core.zip .

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: HCV1000_LoveBerry_iOS_core.zip
