name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install cmake ninja

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Prepare FetchDependencies
        shell: bash
        run: |
          set -e

          FILE="source/finalpkg/cmake/FetchDependencies.cmake"
          PATCH="${GITHUB_WORKSPACE}/source/finalpkg/patches/melonds-7117178-hcv1000-loveberry.patch"

          if [ ! -f "$FILE" ]; then
            echo "FetchDependencies.cmake not found"
            exit 1
          fi

          if [ ! -f "$PATCH" ]; then
            echo "HCV-1000 patch not found"
            exit 1
          fi

          cat > "$FILE" <<'CMAKE'
          macro(define_git_dependency_vars name default_url default_tag)
              string(TOUPPER ${name} VAR_NAME)
              string(MAKE_C_IDENTIFIER ${VAR_NAME} VAR_NAME)

              if (NOT ${VAR_NAME}_REPOSITORY_URL)
                  set(
                      "${VAR_NAME}_REPOSITORY_URL"
                      "${default_url}"
                      CACHE STRING
                      "${name} repository URL. Set this to use a fork."
                      FORCE
                  )
              endif()

              if (NOT ${VAR_NAME}_REPOSITORY_TAG)
                  set(
                      "${VAR_NAME}_REPOSITORY_TAG"
                      "${default_tag}"
                      CACHE STRING
                      "${name} repository commit hash or tag. Set this when using a new version or a custom branch."
                      FORCE
                  )
              endif()
          endmacro()

          function(fetch_dependency name default_url default_tag)
              define_git_dependency_vars(${name} ${default_url} ${default_tag})

              if (FETCHCONTENT_SOURCE_DIR_${VAR_NAME})
                  message(STATUS "Using ${name}: ${FETCHCONTENT_SOURCE_DIR_${VAR_NAME}} (local)")
              else()
                  message(STATUS "Using ${name}: ${${VAR_NAME}_REPOSITORY_URL} (ref ${${VAR_NAME}_REPOSITORY_TAG})")
              endif()

              FetchContent_Declare(
                  ${name}
                  GIT_REPOSITORY "${${VAR_NAME}_REPOSITORY_URL}"
                  GIT_TAG "${${VAR_NAME}_REPOSITORY_TAG}"
              )

              FetchContent_GetProperties(${name})
          endfunction()

          fetch_dependency(melonDS "https://github.com/melonDS-emu/melonDS" "7117178")
          fetch_dependency(libretro-common "https://github.com/libretro/libretro-common" "ad9124f")
          fetch_dependency("embed-binaries" "https://github.com/andoalon/embed-binaries" "078b62b")
          fetch_dependency(glm "https://github.com/g-truc/glm" "e7970a8")
          fetch_dependency(libslirp "https://github.com/JesseTG/libslirp-mirror" "e61dbd4")
          fetch_dependency(pntr "https://github.com/robloach/pntr" "922aed0")
          fetch_dependency(fmt "https://github.com/fmtlib/fmt" "11.2.0")
          fetch_dependency(yamc "https://github.com/yohhoy/yamc" "4e015a7")
          fetch_dependency(span-lite "https://github.com/martinmoene/span-lite" "00afc28")
          fetch_dependency(date "https://github.com/HowardHinnant/date" "1ead671")

          fetch_dependency(zlib "https://github.com/madler/zlib" "v1.3.1")

          if (TRACY_ENABLE)
              fetch_dependency(tracy "https://github.com/wolfpld/tracy" "v0.11.1")
          endif()

          set(
              CMAKE_MODULE_PATH
              "${FETCHCONTENT_BASE_DIR}/melonds-src/cmake"
              "${FETCHCONTENT_BASE_DIR}/embed-binaries-src/cmake"
              "${CMAKE_MODULE_PATH}"
          )

          set(BUILD_STATIC ON)
          set(BUILD_STATIC_LIBS ON)
          set(BUILD_QT_SDL OFF)
          set(ENABLE_GDBSTUB OFF)

          set(GLM_BUILD_LIBRARY ON CACHE BOOL "" FORCE)
          set(GLM_ENABLE_CXX_17 ON CACHE BOOL "" FORCE)

          option(ENABLE_TESTING "Enable unit testing." OFF)

          set(ZLIB_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)

          if (${CMAKE_MAJOR_VERSION} VERSION_GREATER_EQUAL 4)
              set(CMAKE_POLICY_VERSION_MINIMUM 3.5)
          endif()

          message(STATUS "Fetching melonDS source before configuration.")

          FetchContent_Populate(melonDS)

          if (NOT EXISTS "${melonDS_SOURCE_DIR}/CMakeLists.txt")
              message(FATAL_ERROR "melonDS source was not populated correctly.")
          endif()

          message(STATUS "melonDS source: ${melonDS_SOURCE_DIR}")

          execute_process(
              COMMAND
                  "${GIT_EXECUTABLE}"
                  -C "${melonDS_SOURCE_DIR}"
                  apply
                  --whitespace=nowarn
                  --exclude=src/NDS.cpp
                  "${CMAKE_SOURCE_DIR}/patches/melonds-7117178-hcv1000-loveberry.patch"
              RESULT_VARIABLE HCV_PATCH_RESULT
              OUTPUT_VARIABLE HCV_PATCH_STDOUT
              ERROR_VARIABLE HCV_PATCH_STDERR
          )

          if (NOT HCV_PATCH_RESULT EQUAL 0)
              message(STATUS "${HCV_PATCH_STDOUT}")
              message(STATUS "${HCV_PATCH_STDERR}")
              message(FATAL_ERROR "Failed to apply HCV-1000 patch to melonDS.")
          endif()

          message(STATUS "HCV-1000 patch applied successfully.")

          add_subdirectory(
              "${melonDS_SOURCE_DIR}"
              "${melonDS_BINARY_DIR}"
          )

          FetchContent_MakeAvailable(
              libretro-common
              embed-binaries
              glm
              zlib
              libslirp
              pntr
              fmt
              yamc
              span-lite
              date
          )

          if (TRACY_ENABLE)
              set(BUILD_SHARED_LIBS OFF)
              option(TRACY_DELAYED_INIT "" ON)
              option(TRACY_MANUAL_LIFETIME "" ON)
              option(TRACY_ON_DEMAND "" ON)
              option(TRACY_STATIC "" ON)
              FetchContent_MakeAvailable(tracy)
          endif()
          CMAKE

          echo "FetchDependencies.cmake replaced with controlled melonDS/HCV build flow."

      - name: Configure
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake \
            -S source/finalpkg \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -e

          cmake --build build --parallel

      - name: Package
        shell: bash
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          cp -R build/. artifact/

          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            'Target: melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            'HCV-1000 implementation: libretro Slot-2 device' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: artifact/
          if-no-files-found: error
