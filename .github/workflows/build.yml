name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install cmake ninja

      - name: Find source ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e
          rm -rf source
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Prepare HCV-1000 patch
        shell: bash
        run: |
          set -e

          PATCH="source/finalpkg/patches/melonds-7117178-hcv1000-loveberry.patch"

          if [ ! -f "$PATCH" ]; then
            echo "HCV-1000 patch not found: $PATCH"
            exit 1
          fi

          cp "$PATCH" "$RUNNER_TEMP/hcv1000.patch"
          : > "$PATCH"

          echo "Original HCV-1000 patch saved."
          echo "Bundled patch neutralized."

      - name: Configure
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake \
            -S source/finalpkg \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Apply HCV-1000 libretro changes
        shell: bash
        run: |
          set -e

          MELONDS=$(find build -type d -name melonds-src -print -quit)

          if [ -z "$MELONDS" ]; then
            echo "melonds-src not found after Configure"
            exit 1
          fi

          echo "Using melonDS source: $MELONDS"

          cd "$MELONDS"

          git apply \
            --include=src/libretro/CMakeLists.txt \
            --include=src/libretro/config/console.cpp \
            --include=src/libretro/config/hcv1000.cpp \
            --include=src/libretro/config/hcv1000.hpp \
            "$RUNNER_TEMP/hcv1000.patch"

          echo "HCV-1000 libretro changes applied."

      - name: Build
        shell: bash
        run: |
          set -e
          cmake --build build --parallel

      - name: Package
        shell: bash
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          cp -R build/. artifact/

          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            'Target: melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            'HCV-1000 implementation: built-in libretro Slot-2 device' \
            'This package contains the generated build.' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: artifact/
          if-no-files-found: error
