name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install cmake ninja

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Disable bundled patch application
        shell: bash
        run: |
          set -e

          FILE="source/finalpkg/cmake/FetchDependencies.cmake"

          if [ ! -f "$FILE" ]; then
            echo "FetchDependencies.cmake not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          target = "melonds-7117178-hcv1000-loveberry.patch"

          lines = text.splitlines(True)
          found = False
          output = []

          for line in lines:
              if target in line and "git apply" in line:
                  output.append("# DISABLED HCV-1000 bundled patch: " + line)
                  found = True
              else:
                  output.append(line)

          if not found:
              print("Bundled patch command not found.")
              print("Lines containing HCV/patch:")
              for i, line in enumerate(lines, 1):
                  if "HCV" in line or "hcv" in line or "patch" in line:
                      print(f"{i}: {line.rstrip()}")
              sys.exit(1)

          path.write_text("".join(output))
          print("Bundled HCV-1000 git apply command disabled.")
          PY

      - name: Configure
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake \
            -S source/finalpkg \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Apply HCV-1000 patch
        shell: bash
        run: |
          set -e

          PATCH="source/finalpkg/patches/melonds-7117178-hcv1000-loveberry.patch"

          MELONDS=$(find build -type d -name melonds-src -print -quit)

          if [ -z "$MELONDS" ]; then
            echo "melonds-src not found"
            exit 1
          fi

          if [ ! -f "$PATCH" ]; then
            echo "HCV-1000 patch not found"
            exit 1
          fi

          cd "$MELONDS"

          git apply \
            --include=src/libretro/CMakeLists.txt \
            --include=src/libretro/config/console.cpp \
            --include=src/libretro/config/hcv1000.cpp \
            --include=src/libretro/config/hcv1000.hpp \
            "$GITHUB_WORKSPACE/$PATCH"

          echo "HCV-1000 patch applied."

      - name: Build
        shell: bash
        run: |
          set -e
          cmake --build build --parallel

      - name: Package
        shell: bash
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          cp -R build/. artifact/

          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            'Target: melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            'HCV-1000 implementation: libretro Slot-2 device' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: artifact/
          if-no-files-found: error
