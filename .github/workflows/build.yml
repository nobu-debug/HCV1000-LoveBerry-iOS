name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install cmake ninja

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Remove incompatible NDS.cpp patch hunk
        shell: bash
        run: |
          set -e

          PATCH="source/finalpkg/patches/melonds-7117178-hcv1000-loveberry.patch"

          if [ ! -f "$PATCH" ]; then
            echo "HCV-1000 patch not found"
            exit 1
          fi

          python3 - "$PATCH" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          parts = re.split(r'(?=^diff -ruN )', text, flags=re.MULTILINE)

          kept = []
          removed = False

          for part in parts:
              if part.startswith("diff -ruN "):
                  header = part.splitlines()[0]

                  if "/src/NDS.cpp " in header:
                      print("Removed incompatible NDS.cpp patch section.")
                      removed = True
                      continue

              kept.append(part)

          if not removed:
              print("ERROR: NDS.cpp patch section was not found.")
              sys.exit(1)

          new_text = "".join(kept)

          if "/src/NDS.cpp " in new_text:
              print("ERROR: NDS.cpp patch reference still remains.")
              sys.exit(1)

          path.write_text(new_text)

          print("HCV-1000 patch prepared successfully.")
          PY

      - name: Configure
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake \
            -S source/finalpkg \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -e

          cmake --build build --parallel

      - name: Package
        shell: bash
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          cp -R build/. artifact/

          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            'Target: melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            'HCV-1000 implementation: libretro Slot-2 device' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: artifact/
          if-no-files-found: error
