name: Build HCV-1000 Love & Berry iOS core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install cmake ninja

      - name: Find source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Disable bundled HCV-1000 patch
        shell: bash
        run: |
          set -e

          FILE="source/finalpkg/cmake/FetchDependencies.cmake"

          if [ ! -f "$FILE" ]; then
            echo "FetchDependencies.cmake not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          pattern = re.compile(
              r'execute_process\(\s*'
              r'COMMAND\s+"\$\{GIT_EXECUTABLE\}"\s+-C\s+'
              r'"\$\{melonds_SOURCE_DIR\}"\s+apply\s+'
              r'--whitespace=nowarn\s+'
              r'"\$\{CMAKE_SOURCE_DIR\}/patches/'
              r'melonds-7117178-hcv1000-loveberry\.patch"\s+'
              r'RESULT_VARIABLE\s+HCV_PATCH_RESULT\s+'
              r'OUTPUT_VARIABLE\s+HCV_PATCH_STDOUT\s+'
              r'ERROR_VARIABLE\s+HCV_PATCH_STDERR\s*'
              r'\)',
              re.MULTILINE
          )

          replacement = "set(HCV_PATCH_RESULT 0)"

          new_text, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              print("Could not locate the bundled HCV-1000 patch command.")
              print("Relevant section:")
              for i, line in enumerate(text.splitlines(), 1):
                  if "HCV_PATCH" in line or "loveberry.patch" in line:
                      print(f"{i}: {line}")
              sys.exit(1)

          path.write_text(new_text)

          print("Bundled HCV-1000 patch application disabled.")
          PY

      - name: Configure
        shell: bash
        run: |
          set -e

          rm -rf build

          cmake \
            -S source/finalpkg \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Apply HCV-1000 patch
        shell: bash
        run: |
          set -e

          PATCH="source/finalpkg/patches/melonds-7117178-hcv1000-loveberry.patch"

          MELONDS=$(find build -type d -name melonds-src -print -quit)

          if [ -z "$MELONDS" ]; then
            echo "melonds-src not found"
            exit 1
          fi

          if [ ! -f "$PATCH" ]; then
            echo "HCV-1000 patch not found"
            exit 1
          fi

          echo "Using melonDS source: $MELONDS"

          cd "$MELONDS"

          git apply \
            --include=src/libretro/CMakeLists.txt \
            --include=src/libretro/config/console.cpp \
            --include=src/libretro/config/hcv1000.cpp \
            --include=src/libretro/config/hcv1000.hpp \
            "$GITHUB_WORKSPACE/$PATCH"

          echo "HCV-1000 patch applied."

      - name: Build
        shell: bash
        run: |
          set -e

          cmake --build build --parallel

      - name: Package
        shell: bash
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          cp -R build/. artifact/

          printf '%s\n' \
            'HCV-1000 Love & Berry iOS core' \
            'Target: melonDS DS 1.3.1' \
            'Game: Oshare Majo Love and Berry: DS Collection' \
            'Game code: ALBJ' \
            'Default HCV-1000 card: 0UMLMHQ697D' \
            'HCV-1000 implementation: libretro Slot-2 device' \
            > artifact/README.txt

      - name: Upload iOS core
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          path: artifact/
          if-no-files-found: error
