name: Build HCV-1000 Love & Berry IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download successful HCV-1000 iOS core
        uses: actions/download-artifact@v4
        with:
          name: HCV1000-LoveBerry-iOS-core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33619073086
          path: hcv-core

      - name: Locate HCV-1000 melonDS dylib
        shell: bash
        run: |
          set -euo pipefail

          rm -rf hcv-unpack
          mkdir -p hcv-unpack

          HCV_DYLIB="$(find hcv-core -type f -name 'melondsds_libretro.dylib' -print -quit || true)"

          if [ -z "$HCV_DYLIB" ]; then
            CORE_ZIP="$(find hcv-core -type f -name '*.zip' -print -quit || true)"

            if [ -z "$CORE_ZIP" ]; then
              echo "ERROR: HCV-1000 dylib or ZIP was not found."
              find hcv-core -maxdepth 5 -type f | head -200
              exit 1
            fi

            echo "Unpacking core ZIP: $CORE_ZIP"
            unzip -q "$CORE_ZIP" -d hcv-unpack

            HCV_DYLIB="$(find hcv-unpack -type f -name 'melondsds_libretro.dylib' -print -quit || true)"
          fi

          if [ -z "$HCV_DYLIB" ]; then
            echo "ERROR: melondsds_libretro.dylib was not found."
            find hcv-core hcv-unpack -maxdepth 6 -type f | head -300
            exit 1
          fi

          echo "HCV_DYLIB=$PWD/$HCV_DYLIB" >> "$GITHUB_ENV"

          echo "Found HCV-1000 core:"
          file "$HCV_DYLIB"

      - name: Download official Provenance iOS NoExtensions IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ASSET_URL="$(gh api \
            repos/Provenance-Emu/Provenance/releases/tags/alpha \
            --jq '.assets[] | select(.name=="Provenance-iOS-NoExtensions.ipa") | .browser_download_url')"

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: Official Provenance NoExtensions IPA was not found."
            exit 1
          fi

          echo "Downloading official Provenance IPA..."

          curl -L \
            --fail \
            --retry 3 \
            --retry-all-errors \
            -o Provenance-iOS-NoExtensions.ipa \
            "$ASSET_URL"

          ls -lh Provenance-iOS-NoExtensions.ipa

      - name: Unpack official Provenance IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ipa-work
          mkdir -p ipa-work

          unzip -q Provenance-iOS-NoExtensions.ipa -d ipa-work

          APP_PATH="$(find ipa-work/Payload -maxdepth 1 -type d -name 'Provenance*.app' -print -quit || true)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Provenance.app was not found."
            find ipa-work/Payload -maxdepth 2 -print | head -200
            exit 1
          fi

          echo "APP_PATH=$PWD/$APP_PATH" >> "$GITHUB_ENV"

          echo "Provenance app:"
          echo "$APP_PATH"

      - name: Verify official Provenance contains melonDS core
        shell: bash
        run: |
          set -euo pipefail

          BUNDLED_DYLIB="$(find "$APP_PATH" \
            -type f \
            -name 'melondsds_libretro.dylib' \
            -print -quit || true)"

          if [ -z "$BUNDLED_DYLIB" ]; then
            echo "ERROR: Official Provenance IPA does not contain melondsds_libretro.dylib."

            echo "Possible libretro files:"
            find "$APP_PATH" -type f \
              \( -name '*melonds*' -o -name '*libretro*' \) \
              -print | head -200

            exit 1
          fi

          echo "BUNDLED_DYLIB=$BUNDLED_DYLIB" >> "$GITHUB_ENV"

          echo "Original Provenance melonDS core:"
          file "$BUNDLED_DYLIB"

      - name: Verify HCV-1000 core before replacement
        shell: bash
        run: |
          set -euo pipefail

          echo "HCV-1000 core:"
          file "$HCV_DYLIB"

          echo "Mach-O header:"
          otool -hv "$HCV_DYLIB"

          echo "Build version:"
          otool -l "$HCV_DYLIB" | grep -A5 -m1 LC_BUILD_VERSION || true

      - name: Replace Provenance melonDS core
        shell: bash
        run: |
          set -euo pipefail

          echo "Replacing:"
          echo "$BUNDLED_DYLIB"

          cp "$HCV_DYLIB" "$BUNDLED_DYLIB"
          chmod 755 "$BUNDLED_DYLIB"

          echo "Replacement completed."

      - name: Verify final HCV-1000 iOS core
        shell: bash
        run: |
          set -euo pipefail

          echo "Final dylib:"
          file "$BUNDLED_DYLIB"

          echo "Mach-O header:"
          otool -hv "$BUNDLED_DYLIB"

          echo "Build version:"
          PLATFORM_INFO="$(otool -l "$BUNDLED_DYLIB" | grep -A5 -m1 LC_BUILD_VERSION || true)"
          echo "$PLATFORM_INFO"

          if ! otool -hv "$BUNDLED_DYLIB" | grep -q 'ARM64'; then
            echo "ERROR: Final dylib is not ARM64."
            exit 1
          fi

          if ! echo "$PLATFORM_INFO" | grep -qE 'platform (2|IOS)'; then
            echo "ERROR: Final dylib is not identified as iOS."
            exit 1
          fi

          echo "HCV-1000 iOS ARM64 core verification passed."

      - name: Repack IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -f HCV1000-LoveBerry-Provenance-iOS.ipa

          (
            cd ipa-work
            zip -qry \
              ../HCV1000-LoveBerry-Provenance-iOS.ipa \
              Payload
          )

          ls -lh HCV1000-LoveBerry-Provenance-iOS.ipa

      - name: Verify final IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking final IPA..."

          unzip -l HCV1000-LoveBerry-Provenance-iOS.ipa \
            | grep 'melondsds_libretro.dylib'

          test -s HCV1000-LoveBerry-Provenance-iOS.ipa

          echo "Final IPA verification passed."

      - name: Upload finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-Provenance-iOS-IPA
          path: HCV1000-LoveBerry-Provenance-iOS.ipa
          if-no-files-found: error
          retention-days: 7
