name: Build HCV-1000 Love & Berry IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download HCV-1000 iOS core
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33619073086
          name: HCV1000-LoveBerry-iOS-core
          path: hcv-core

      - name: Locate HCV-1000 core
        shell: bash
        run: |
          set -euo pipefail

          HCV_CORE="$(find hcv-core -type f -name 'melondsds_libretro.dylib' -print -quit)"

          if [ -z "$HCV_CORE" ]; then
            echo "ERROR: HCV-1000 core not found"
            find hcv-core -type f -print
            exit 1
          fi

          echo "HCV_CORE=$HCV_CORE" >> "$GITHUB_ENV"

          echo "Found:"
          file "$HCV_CORE"
          lipo -info "$HCV_CORE" || true

      - name: Download current official Provenance IPA
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/Provenance-Emu/Provenance/releases/latest"

          echo "Getting latest Provenance release..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API" \
            -o release.json

          echo "Release assets:"
          jq -r '.assets[] | "\(.name) \(.browser_download_url)"' release.json

          IPA_URL="$(
            jq -r '
              .assets[]
              | select(.name | test("Provenance-iOS.*\\.ipa$"; "i"))
              | .browser_download_url
            ' release.json | head -1
          )"

          if [ -z "$IPA_URL" ]; then
            echo "ERROR: No iOS IPA found in latest Provenance release"
            exit 1
          fi

          echo "IPA URL:"
          echo "$IPA_URL"

          curl -fL \
            --retry 3 \
            -o provenance.ipa \
            "$IPA_URL"

          test -s provenance.ipa

          ls -lh provenance.ipa

      - name: Unpack Provenance IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ipa
          mkdir -p ipa

          unzip -q provenance.ipa -d ipa

          APP="$(find ipa/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: Provenance app not found"
            find ipa/Payload -maxdepth 2 -print
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "App:"
          echo "$APP"

      - name: Locate Provenance melonDS framework
        shell: bash
        run: |
          set -euo pipefail

          FRAMEWORK="$(
            find "$APP/Frameworks" \
              -type f \
              -path '*/melonds.libretro.framework/melonds.libretro' \
              -print -quit
          )"

          if [ -z "$FRAMEWORK" ]; then
            echo "ERROR: Provenance melonDS framework not found"

            echo "Framework contents:"
            find "$APP/Frameworks" -maxdepth 4 -print | sort

            exit 1
          fi

          FRAMEWORK_DIR="$(dirname "$FRAMEWORK")"

          echo "PROVENANCE_MELONDS=$FRAMEWORK" >> "$GITHUB_ENV"
          echo "PROVENANCE_MELONDS_DIR=$FRAMEWORK_DIR" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$FRAMEWORK"

          file "$FRAMEWORK"
          lipo -info "$FRAMEWORK" || true

      - name: Verify replacement files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== HCV CORE ====="
          file "$HCV_CORE"
          lipo -info "$HCV_CORE" || true

          echo
          echo "===== PROVENANCE CORE ====="
          file "$PROVENANCE_MELONDS"
          lipo -info "$PROVENANCE_MELONDS" || true

          echo
          echo "===== TARGET DIRECTORY ====="
          ls -la "$PROVENANCE_MELONDS_DIR"

      - name: Replace Provenance melonDS core
        shell: bash
        run: |
          set -euo pipefail

          cp "$HCV_CORE" "$PROVENANCE_MELONDS"

          chmod 755 "$PROVENANCE_MELONDS"

          rm -rf "$PROVENANCE_MELONDS_DIR/_CodeSignature"

          echo "Replacement completed."

          file "$PROVENANCE_MELONDS"
          lipo -info "$PROVENANCE_MELONDS" || true

      - name: Repack IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -f HCV1000-LoveBerry-Provenance.ipa

          cd ipa
          zip -qry ../HCV1000-LoveBerry-Provenance.ipa Payload
          cd ..

          test -s HCV1000-LoveBerry-Provenance.ipa

          ls -lh HCV1000-LoveBerry-Provenance.ipa

      - name: Verify final IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf verify
          mkdir verify

          unzip -q HCV1000-LoveBerry-Provenance.ipa -d verify

          FINAL_CORE="$(
            find verify/Payload \
              -type f \
              -path '*/melonds.libretro.framework/melonds.libretro' \
              -print -quit
          )"

          if [ -z "$FINAL_CORE" ]; then
            echo "ERROR: final melonDS core missing"
            exit 1
          fi

          echo "FINAL CORE:"
          echo "$FINAL_CORE"

          file "$FINAL_CORE"
          lipo -info "$FINAL_CORE" || true

          echo
          echo "IPA CONTENT:"
          unzip -l HCV1000-LoveBerry-Provenance.ipa \
            | grep 'melonds.libretro.framework/melonds.libretro'

          echo
          echo "FINAL IPA VERIFICATION PASSED."

      - name: Upload final IPA
        uses: actions/upload-artifact@v4
        with:
          name: HCV1000-LoveBerry-Provenance-IPA
          path: HCV1000-LoveBerry-Provenance.ipa
          if-no-files-found: error
